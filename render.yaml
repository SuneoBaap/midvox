services:
  - type: web
    name: midvox
    env: python
    buildCommand: |
      pip install -r bot/requirements.txt
      mkdir -p .node
      curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz | tar -xzf - -C .node --strip-components=1
      export PATH="$PWD/.node/bin:$PATH"
      cd dashboard && npm install && npm run build
    startCommand: bash start.sh
    envVars:
      - key: TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: API_ENABLED
        value: "true"
      - key: API_PORT
        value: "5001"
      - key: DASHBOARD_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: TUNNEL_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
      - key: NEXT_PUBLIC_DASHBOARD_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        value: "https://midvox.onrender.com"
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_ADMIN_IDS
        sync: false
      - key: NEXT_PUBLIC_BRAND_NAME
        value: "MidVox"
      - key: NEXT_PUBLIC_BRAND_NAME_WORD
        value: "MV"
